name: Beacon CI

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Verify PWA files
        run: |
          test -f index.html
          test -f manifest.json
          test -f sw.js
          echo "Beacon PWA files found ✅"
