<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Beacon</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.PNG">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div id="header">
  Beacon
</div>

<div id="chat">

  <div class="message beacon">
    What are we researching today?
  </div>

</div>

<div id="composer">

  <input
    id="prompt"
    type="text"
    placeholder="Talk to Beacon..."
    autocomplete="off"
  >

  <button id="actionBtn">

    <!-- microphone -->
    <svg
      id="micIcon"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round">

      <rect
        x="9"
        y="2"
        width="6"
        height="12"
        rx="3">
      </rect>

      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>

      <line x1="12" y1="19" x2="12" y2="22"></line>

      <line x1="8" y1="22" x2="16" y2="22"></line>

    </svg>

    <!-- send -->
    <svg
      id="sendIcon"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round">

      <path d="M12 19V5"></path>
      <path d="M5 12l7-7 7 7"></path>

    </svg>

  </button>

</div>

<script src="js/gemini.js"></script>

</body>
</html>
