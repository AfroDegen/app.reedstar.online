<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Beacon</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.PNG">

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      background:#ffffff;
      color:#111827;

      font-family:-apple-system,BlinkMacSystemFont,sans-serif;

      min-height:100vh;

      display:flex;
      flex-direction:column;
    }

    #header{
      padding:24px;
      text-align:center;

      color:#6b7280;
      font-size:18px;
      font-weight:500;
    }

    #chat{
      flex:1;
      overflow-y:auto;

      padding:24px;
      padding-bottom:120px;
    }

    .message{
      max-width:90%;
      line-height:1.6;
      margin-bottom:20px;
    }

    .beacon{
      background:#f3f4f6;
      padding:16px;
      border-radius:18px;
    }

    #composer{
      position:fixed;

      left:16px;
      right:16px;
      bottom:20px;

      background:white;

      border:1px solid #e5e7eb;
      border-radius:30px;

      display:flex;
      align-items:center;

      padding:12px;

      box-shadow:
        0 8px 30px rgba(0,0,0,.08);
    }

    #prompt{
      flex:1;

      border:none;
      outline:none;

      font-size:16px;

      padding:8px;

      background:transparent;
    }

    #micBtn{
      width:42px;
      height:42px;

      border:none;
      background:none;

      display:flex;
      align-items:center;
      justify-content:center;

      cursor:pointer;
    }

    #micBtn img{
      width:20px;
      height:20px;
    }

  </style>

</head>

<body>

  <div id="header">
    Beacon
  </div>

  <div id="chat">

    <div class="message beacon">
      Hello Fareed. What are we researching today?
    </div>

  </div>

  <div id="composer">

    <input
      id="prompt"
      type="text"
      placeholder="Talk to Beacon..."
    >

    <button id="micBtn">
      icons/microphone.svg
    </button>

  </div>

  js/gemini.jsscript>
  js/mic.jsscript>
  js/app.jsscript>

</body>

</html>
