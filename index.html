<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Beacon</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.PNG">

  <meta name="theme-color" content="#000814">

  <style>
    body {
      margin: 0;
      background: #000814;
      color: white;
      font-family: system-ui, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      margin-top: 20px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 16px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>R⭐️ Beacon</h1>

    <input
      type="text"
      placeholder="Talk to Beacon..."
    />

    <button>🎙️</button>

  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

  js/ui.jsscript>
  js/mic.jsscript>
  js/app.jsscript>

</body>
</html>
