<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beacon</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.PNG">

  <meta name="theme-color" content="#000814">

  <style>

    body{
      margin:0;
      min-height:100vh;

      background:#000814;
      color:white;

      font-family:system-ui,sans-serif;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    .container{
      width:90%;
      max-width:600px;
      text-align:center;
    }

    h1{
      margin-bottom:30px;
      font-size:2rem;
    }

    input{
      width:100%;
      box-sizing:border-box;

      padding:18px;

      border:none;
      border-radius:14px;

      font-size:16px;
    }

    .buttons{
      display:flex;
      gap:12px;

      justify-content:center;

      margin-top:18px;
    }

    button{
      border:none;
      border-radius:12px;

      padding:16px 20px;

      font-size:18px;

      cursor:pointer;
    }

    #response{
      margin-top:24px;

      min-height:120px;

      padding:20px;

      border-radius:14px;

      background:#111827;

      text-align:left;

      white-space:pre-wrap;
      line-height:1.6;
    }

    #status{
      margin-top:16px;
      color:#9ca3af;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>R⭐️ Beacon</h1>

  <input
    id="prompt"
    type="text"
    placeholder="Talk to Beacon..."
  >

  <div class="buttons">

    <button id="askBtn">
      Ask Beacon
    </button>

    <button id="micBtn">
      🎙️
    </button>

  </div>

  <div id="status">
    Beacon Online
  </div>

  <div id="response">
    Ask me anything.
  </div>

</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

js/gemini.jsscript>
js/mic.jsscript>
js/app.jsscript>

</body>
</html>
