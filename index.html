<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Beacon</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.PNG">

  <meta name="theme-color" content="#000814">

  <style>
    body {
      margin: 0;
      background: #000814;
      color: white;
      font-family: system-ui, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 16px;
      box-sizing: border-box;

      border: none;
      border-radius: 12px;

      font-size: 16px;
    }

    button {
      margin-top: 16px;

      width: 80px;
      height: 80px;

      border: none;
      border-radius: 12px;

      font-size: 30px;

      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      color: #a0aec0;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>R⭐️ Beacon</h1>

    <input
      id="prompt"
      type="text"
      placeholder="Talk to Beacon..."
    />

    <button id="micBtn">🎙️</button>

    <div id="status">
      Tap microphone to speak
    </div>

  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

  <script src="js/mic.js"></script>

</body>
</html>
